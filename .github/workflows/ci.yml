name: CI

on:
  push:
    branches: [main]
    # Cambios solo de documentación/docs no disparan el CI (ahorro de minutos).
    # .github/** queda fuera a propósito: cambios al workflow deben validarse.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - '.gitignore'
      - 'installer/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - '.gitignore'
      - 'installer/**'

# Si hay varios pushes seguidos en la misma rama, solo se completa el último.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Análisis y tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # .env está en .gitignore (no se sube); el CI solo necesita que el
      # asset declarado en pubspec exista para que flutter analyze pase.
      - name: Preparar .env placeholder
        run: cp .env.example .env

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Obtener dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Tests
        run: flutter test

  build-linux:
    name: Build Linux (release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Toolchain de Linux desktop (ver README → Despliegue → Linux).
      - name: Instalar toolchain Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Preparar .env placeholder
        run: cp .env.example .env

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Obtener dependencias
        run: flutter pub get

      - name: Build release
        run: flutter build linux --release --no-tree-shake-icons

      - name: Subir bundle
        uses: actions/upload-artifact@v4
        with:
          name: devjobs-linux-x64
          path: build/linux/x64/release/bundle/
          if-no-files-found: error
