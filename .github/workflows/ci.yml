name: CI

on:
  push:
    branches: [main]
    # Cambios solo de documentación/docs no disparan el CI (ahorro de minutos).
    # .github/** queda fuera a propósito: cambios al workflow deben validarse.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - '.gitignore'
      - 'installer/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'screenshots/**'
      - '.gitignore'
      - 'installer/**'

# Si hay varios pushes seguidos en la misma rama, solo se completa el último.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Análisis y tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # .env está en .gitignore (no se sube); el CI solo necesita que el
      # asset declarado en pubspec exista para que flutter analyze pase.
      - name: Preparar .env placeholder
        run: cp .env.example .env

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Obtener dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Tests
        run: flutter test
